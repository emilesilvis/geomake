[project]
name = "geomake"
version = "0.1.0"
description = "Backwards-constructed geometry puzzle generator with controllable difficulty"
requires-python = ">=3.10"
dependencies = ["sympy>=1.12", "matplotlib>=3.7"]

[project.optional-dependencies]
verify = ["shapely>=2.0"]
test = ["pytest"]

[project.scripts]
geomake = "geomake.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["geomake"]
